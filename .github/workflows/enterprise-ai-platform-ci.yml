name: Enterprise AI Platform CI

on:
  pull_request:
    paths:
      - "projects/enterprise-ai-platform/**"
      - ".github/workflows/enterprise-ai-platform-ci.yml"
  push:
    branches: [main]
    paths:
      - "projects/enterprise-ai-platform/**"
      - ".github/workflows/enterprise-ai-platform-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/enterprise-ai-platform
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: enterprise_ai
          POSTGRES_PASSWORD: enterprise_ai_dev
          POSTGRES_DB: enterprise_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U enterprise_ai -d enterprise_ai"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DATABASE_URL: postgresql+psycopg://enterprise_ai:enterprise_ai_dev@localhost:5432/enterprise_ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/enterprise-ai-platform/pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Run test suite
        run: pytest -q
